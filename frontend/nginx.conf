server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  # Serve static files directly, fallback to index.html for SPA routes
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API requests to backend container so browser can call same-origin
  location /api/ {
    # Prefer IPv4 resolution inside containers to avoid intermittent IPv6
    # resolution attempts on some host/WSL setups. Use Docker's internal DNS
    # resolver and disable IPv6 lookups.
    resolver 127.0.0.11 ipv6=off;
    proxy_pass http://backend:8001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    proxy_buffering off;
  }

  location /static/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Runtime config file must never be cached, otherwise tablets can keep
  # old API endpoints and show false offline errors.
  location = /env.js {
    try_files $uri =404;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    add_header Pragma "no-cache";
  }

  location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2|woff|ttf)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Optional: small gzip settings
  gzip on;
  gzip_types text/plain application/javascript application/json text/css text/xml application/xml application/xml+rss text/javascript;
}
