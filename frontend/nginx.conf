server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  # IMPORTANT: do NOT send upgrade-insecure-requests on plain HTTP (:3000).
  # That header forces the browser to load /assets/*.js over https://host:3000,
  # which is not TLS-enabled → white screen / ERR_SSL_PROTOCOL_ERROR.
  # Camera/scanner must use the dedicated HTTPS port :3443 instead
  # (see HTTPS_CAMERA_SCANNER.md and cameraAccess.getRecommendedCameraUrl).

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    add_header Pragma "no-cache";
    expires -1;
  }

  location ^~ /api/ {
    resolver 127.0.0.11 ipv6=off;
    proxy_pass http://backend:8001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    proxy_buffering off;
  }

  location /static/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /env.js {
    try_files $uri =404;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    add_header Pragma "no-cache";
  }

  location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2|woff|ttf)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  gzip on;
  gzip_types text/plain application/javascript application/json text/css text/xml application/xml application/xml+rss text/javascript;
}

server {
  listen 443 ssl;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  ssl_certificate /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    add_header Pragma "no-cache";
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    expires -1;
  }

  location ^~ /api/ {
    resolver 127.0.0.11 ipv6=off;
    proxy_pass http://backend:8001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection '';
    proxy_buffering off;
  }

  location /static/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /env.js {
    try_files $uri =404;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    add_header Pragma "no-cache";
  }

  location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2|woff|ttf)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  gzip on;
  gzip_types text/plain application/javascript application/json text/css text/xml application/xml application/xml+rss text/javascript;
}