<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="MUNDO DE ACCESORIOS ERP - Sistema de facturación e inventario" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MUNDO DE ACCESORIOS" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>MUNDO DE ACCESORIOS ERP</title>
    <script>
      if (window.self !== window.top) {
        var debugMonitorScript = document.createElement("script");
        debugMonitorScript.src = "https://assets.emergent.sh/scripts/debug-monitor.js";
        document.head.appendChild(debugMonitorScript);

        window.tailwind = window.tailwind || {};
        tailwind.config = { corePlugins: { preflight: false } };

        var tailwindScript = document.createElement("script");
        tailwindScript.src = "https://cdn.tailwindcss.com";
        document.head.appendChild(tailwindScript);
      }
    </script>
    <script>
      (function() {
        document.addEventListener("contextmenu", function(e) {
          var tag = String(e.target && e.target.tagName || "").toLowerCase();
          if (tag !== "input" && tag !== "textarea" && !(e.target && e.target.isContentEditable)) {
            e.preventDefault();
          }
        }, true);
        window.addEventListener("keydown", function(e) {
          var k = (e.key || "").toUpperCase();
          var c = e.keyCode || e.which;
          var ctrl = e.ctrlKey || e.metaKey;
          if (k === "F12" || c === 123) { e.preventDefault(); e.stopPropagation(); }
          if (ctrl && e.shiftKey && (k === "I" || k === "J" || k === "C" || k === "K" || c === 73 || c === 74 || c === 67 || c === 75)) { e.preventDefault(); e.stopPropagation(); }
          if (ctrl && (k === "U" || c === 85)) { e.preventDefault(); e.stopPropagation(); }
        }, true);
      })();
    </script>
    <script src="/env.js"></script>
  </head>
  <body>
    <noscript>Necesitas habilitar JavaScript para usar esta aplicacion.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
