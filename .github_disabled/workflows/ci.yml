name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.adminCommand(\"ping\")' || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
    env:
      REACT_APP_BACKEND_URL: http://localhost:8001
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: mundo_accesorios_erp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install backend requirements
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r backend/requirements.txt

      - name: Wait for Mongo
        run: |
          for i in {1..60}; do
            if mongosh --quiet --eval 'db.adminCommand("ping")' >/dev/null 2>&1; then
              echo "mongo up" && break
            fi
            echo "waiting for mongo... ($i)" && sleep $((i<10?1:5))
          done

      - name: Start backend
        run: |
          nohup uvicorn backend.server:app --host 0.0.0.0 --port 8001 &
          # wait for backend to be healthy with backoff
          for i in {1..30}; do
            if curl -sS http://localhost:8001/api/ >/dev/null; then
              echo "backend up" && break
            fi
            sleep $((i<5?1:5))
          done

      - name: Create test session and promote Xinon admin
        run: |
          set -euo pipefail
          # Create a test session and extract session_token
          SESSION_JSON=$(curl -s -X POST http://localhost:8001/api/test/create-session)
          echo "session response: $SESSION_JSON"
          SESSION_TOKEN=$(echo "$SESSION_JSON" | python -c "import sys,json; print(json.load(sys.stdin).get('session_token',''))")
          if [ -z "$SESSION_TOKEN" ]; then
            echo "Failed to obtain session token" >&2
            echo "$SESSION_JSON" >&2
            exit 1
          fi
          # Promote Xinon and fail the job if promotion doesn't return 2xx
          PROM_HTTP_CODE=$(curl -s -o /dev/stderr -w "%{http_code}" -X POST "http://localhost:8001/api/users/promote-admin?email=dayavar18@gmail.com" -H "Authorization: Bearer ${SESSION_TOKEN}") || true
          if [[ "$PROM_HTTP_CODE" -lt 200 || "$PROM_HTTP_CODE" -ge 300 ]]; then
            echo "Promote admin returned HTTP $PROM_HTTP_CODE" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        run: |
          npm ci --legacy-peer-deps --prefix frontend

      - name: Build frontend
        run: |
          npm run build --prefix frontend

      - name: Run backend tests
        run: |
          pytest backend/tests -q
