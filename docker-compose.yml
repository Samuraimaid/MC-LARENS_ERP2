# ============================================================
# MUNDO DE ACCESORIOS ERP - Docker Compose (Alternativa)
# ============================================================
# Usar si prefieres Docker en lugar de instalación manual
# Ejecutar: docker-compose up -d
# ============================================================

services:
  # Base de datos MongoDB
  mongodb:
    image: mongo:7.0
    container_name: mclarens2-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./backups/mongodb:/backup/host
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - mundo-network

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mc-larenserp20-backend:updated-20260619c
    container_name: mundo-backend
    restart: unless-stopped
    ports:
      - "8001:8001"  # 0.0.0.0 — accesible en LAN (ej. 192.168.1.26:8001)
    environment:
      - BRANCH_ID=${BRANCH_ID:-branch_main}
      - MONGODB_LOCAL_URI=${MONGODB_LOCAL_URI:-mongodb://mongodb:27017}
      - MONGO_URL=${MONGODB_LOCAL_URI:-mongodb://mongodb:27017}
      - DB_NAME=mc-larens2_mundo_accesorios_erp
      - MONGODB_CENTRAL_URI=${MONGODB_CENTRAL_URI:-}
      - MONGODB_CENTRAL_DB=${MONGODB_CENTRAL_DB:-mc-larens2_mundo_accesorios_erp}
      - DEFAULT_BRANCH_ID=${BRANCH_ID:-branch_main}
      - NODE_ID=${NODE_ID:-${BRANCH_ID:-branch_main}}
      - NODE_NAME=${NODE_NAME:-Mundo de Accesorios}
      - NODE_TYPE=${NODE_TYPE:-SUCURSAL}
      - NODE_ENABLE_SALES=${NODE_ENABLE_SALES:-true}
      - NODE_ENABLE_WORKSHOP=${NODE_ENABLE_WORKSHOP:-true}
      - NODE_ENABLE_HR=${NODE_ENABLE_HR:-true}
      - SERVER_LAN_IP=${SERVER_LAN_IP:-192.168.1.26}
      - SERVER_FRONTEND_PORT=${SERVER_FRONTEND_PORT:-3000}
      - HARDWARE_BEEP_FLAG_PATH=/app/backend/data/hardware_beep.flag
      - ENABLE_TEST_ENDPOINTS=false
      - ENABLE_TEST_PIN_SEEDING=false
      - AUTOLOAD_CORE_SEED=true
      - DEFAULT_PIN_USER_EMAIL=xinon@local
      - DEFAULT_PIN_USER_PIN=0101
      - DEFAULT_LOGIN_PIN_USER_PIN=01011990
      # Seguridad: por defecto RRHH no puede cambiar/resetear PIN de terceros.
      - ALLOW_RRHH_PIN_MANAGEMENT=false
      # ADVERTENCIA: modificar CORS_ORIGINS puede romper el login (PIN) en el frontend.
      - CORS_ORIGINS=http://127.0.0.1:3000,http://localhost:3000,http://127.0.0.1:3001,http://localhost:3001,http://127.0.0.1:8001,http://localhost:8001,http://192.168.1.26:3000,http://192.168.1.26:8001,https://192.168.1.26:3443
      - AUTH_SESSION_DATA_URL=
      - COOKIE_SECURE=false
      - LABEL_PRINT_BRIDGE_URL=http://host.docker.internal:9265
      - LABEL_PRINTER_NAME=Xprinter XP-460B
      - LABEL_BRIDGE_TOKEN_FILE=/app/backend/data/label-bridge-token.txt
      - POS_VOUCHER_BRIDGE_URL=http://host.docker.internal:9266
      - POS_VOUCHER_PRINTER_NAME=POS-80 Voucher
      - POS_BRIDGE_TOKEN_FILE=/app/backend/data/pos-voucher-bridge-token.txt
      - LOCAL_UPLOAD_ROOT=/app/uploads
      - PUBLIC_TUNNEL_URL_MAIN=${PUBLIC_TUNNEL_URL_MAIN:-https://mclarenerp.com}
      - PUBLIC_TUNNEL_URL_NORTH=${PUBLIC_TUNNEL_URL_NORTH:-https://north.mclarenerp.com}
      - PUBLIC_TUNNEL_URL_SOUTH=${PUBLIC_TUNNEL_URL_SOUTH:-https://south.mclarenerp.com}
      - BACKUP_INTERNAL_ROOT=/app/backups
      - USB_BACKUP_ROOT=/mnt/usb_backup
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/backups:/app/backups
      - ./backups/usb:/mnt/usb_backup
      - ./backend/data/vehicle-thumbnails:/app/backend/data/vehicle-thumbnails
      - ./backend/data/label-bridge-token.txt:/app/backend/data/label-bridge-token.txt
      - ./backend/data/pos-voucher-bridge-token.txt:/app/backend/data/pos-voucher-bridge-token.txt
      - ./frontend/src/data/vehicleCatalog.json:/app/backend/data/vehicleCatalog.json
      - ./backend/data/vehicle-descriptor-types.json:/app/backend/data/vehicle-descriptor-types.json
      - ./backend/data/vehicle-catalog-history:/app/backend/data/vehicle-catalog-history
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      mundo-network:
        aliases:
          - backend

  # Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ""
        VITE_AUTH_URL: /api/auth/login
        VITE_ATTENDANCE_KIOSK_SHORTCUT_PIN: "50005000"
        VITE_FAILOVER_TUNNEL_MAIN: ${VITE_FAILOVER_TUNNEL_MAIN:-https://mclarenerp.com}
        VITE_FAILOVER_TUNNEL_NORTH: ${VITE_FAILOVER_TUNNEL_NORTH:-https://north.mclarenerp.com}
        VITE_FAILOVER_TUNNEL_SOUTH: ${VITE_FAILOVER_TUNNEL_SOUTH:-https://south.mclarenerp.com}
    image: mundo-frontend:updated-20260619c
    container_name: mundo-frontend
    restart: unless-stopped
    ports:
      - "3000:80"    # 0.0.0.0 — accesible en LAN (ej. 192.168.1.26:3000)
      - "3443:443"   # 0.0.0.0 — HTTPS LAN
    environment:
      - VITE_BACKEND_URL=
      - VITE_AUTH_URL=/api/auth/login
      - VITE_ATTENDANCE_KIOSK_SHORTCUT_PIN=50005000
      - REACT_APP_BACKEND_URL=
      - REACT_APP_AUTH_URL=/api/auth/login
      - REACT_APP_ATTENDANCE_KIOSK_SHORTCUT_PIN=50005000
      - HTTPS_CERT_CN=localhost
      - HTTPS_CERT_DNS=localhost
      - HTTPS_CERT_IPS=${HTTPS_CERT_IPS:-127.0.0.1,192.168.1.26}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      mundo-network:
        aliases:
          - frontend

volumes:
  mongodb_data:

networks:
  mundo-network:
    driver: bridge
