name: Build Android APK

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:
  release:
    types: [published, created]

jobs:
  build-apk:
    name: Compile Android APK (Debug & Release Ready)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund

      - name: Build Web Application
        working-directory: frontend
        run: |
          npm run build

      - name: Sync Capacitor Android Project
        working-directory: frontend
        run: |
          npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x frontend/android/gradlew

      - name: Build Android Debug APK with Gradle
        working-directory: frontend/android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mclarens-erp-android-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Attach APK to GitHub Release (If triggered by release)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
